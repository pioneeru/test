name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0/5 * * * *' # Runs every Monday at 01:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload SARIF results

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'python' # Tells CodeQL to run Python query packs

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3 # Optional for Python

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
